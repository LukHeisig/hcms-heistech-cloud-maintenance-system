<mjml>
  <mj-head>
    <mj-title>Váš účet v HCMS je aktivován</mj-title>
    <mj-preview>Byli jste připojeni k podniku {{company_name}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="Arial, Helvetica, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-text color="#0a0a0a" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#2563eb" color="#ffffff" border-radius="8px" font-weight="700" inner-padding="14px 28px" align="left" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#ffffff">
    <mj-section background-color="#2563eb" padding="20px 36px">
      <mj-group>
        <mj-column width="15%" vertical-align="middle">
          <mj-image src="https://media.base44.com/images/public/68f9f91f76faef5f76f2ef4a/38f0a76ec_logo.png" width="40px" align="left" padding="0" />
        </mj-column>
        <mj-column width="85%" vertical-align="middle">
          <mj-text color="#ffffff" font-size="18px" font-weight="700">HCMS</mj-text>
        </mj-column>
      </mj-group>
    </mj-section>
    <mj-section padding="40px 36px 8px">
      <mj-column>
        <mj-text font-size="28px" font-weight="700" line-height="1.2">Váš účet je aktivován</mj-text>
        <mj-text color="#737373" padding="10px 0 0">Dobrý den {{first_name}}, nyní máte přístup do aplikace HCMS.</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="24px 36px">
      <mj-column border="1px solid #e5e5e5" border-radius="8px" padding="16px">
        <mj-text color="#737373" font-size="13px">Podnik</mj-text>
        <mj-text font-weight="700" padding="0 0 12px">{{company_name}}</mj-text>
        <mj-text color="#737373" font-size="13px">Role</mj-text>
        <mj-text font-weight="700">{{role_label}}</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="8px 36px 40px">
      <mj-column>
        <mj-button href="https://hcmsonline.com">Otevřít HCMS</mj-button>
      </mj-column>
    </mj-section>
    <mj-section background-color="#f5f5f5" padding="20px 36px">
      <mj-column>
        <mj-text color="#737373" font-size="12px">Tato zpráva byla odeslána automaticky systémem HCMS.</mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
